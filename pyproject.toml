[tool.poetry]
name = "dgi-toolkit"
version = "0.1.0"
description = ""
authors = ["rubendominguezfalcon <nabariho@gmail.com>"]
readme = "README.md"
packages = [{include = "dgi", from = "."}]

[tool.poetry.scripts]
dgi = "dgi.cli:app"

[tool.poetry.dependencies]
python = "^3.12"
pandas = "^2.3.1"
typer = {extras = ["all"], version = "^0.16.0"}
rich = "^14.0.0"
pydantic = "^2.0"
matplotlib = "^3.10.3"
langchain = "^0.3.26"
openai = "^1.97.1"
langchain-community = "^0.3.27"
langchain-openai = "^0.3.28"
langchain-anthropic = "^0.3.17"
fastapi = "^0.116.1"
uvicorn = {extras = ["standard"], version = "^0.35.0"}
slowapi = "^0.1.9"
python-multipart = "^0.0.6"
pydantic-settings = "^2.10.1"


[tool.poetry.group.dev.dependencies]
pytest = "^8.4.1"
pytest-cov = "^6.2.1"
notebook = "^7.4.4"
pre-commit = "^4.2.0"
mypy = "^1.17.0"
pandas-stubs = "^2.3.0.250703"
black = {extras = ["jupyter"], version = "^25.1.0"}
ruff = "^0.4.4"
isort = "^6.0.1"
bandit = "^1.8.6"
httpx = "^0.28.1"
pytest-asyncio = "^1.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py313']

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py313"

# Exclude notebooks and other non-standard Python files
exclude = [
    "notebooks/",
    ".git",
    "__pycache__",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
]

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
select = [
    "E4",   # pycodestyle errors
    "E7",   # pycodestyle errors
    "E9",   # pycodestyle errors
    "F",    # Pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "PIE",  # flake8-pie
    "TCH",  # flake8-type-checking
    "RUF",  # Ruff-specific rules
]

# Never enforce `E501` (line length violations) in docstrings or comments
ignore = ["E501"]

# Allow autofix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.isort]
known-first-party = ["dgi", "api"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 88

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pyupgrade]
# Preserve types, even if a file imports `from __future__ import annotations`.
keep-runtime-typing = true

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*" = ["B011"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "pandas.*",
    "numpy.*",
    "matplotlib.*",
    "langchain.*",
    "openai.*",
    "anthropic.*",
]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101", "B601"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--disable-warnings",
    "--tb=short",
    "--cov=dgi",
    "--cov=api",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-fail-under=85",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "api: API tests",
    "slow: Slow running tests",
    "e2e: End-to-end tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
